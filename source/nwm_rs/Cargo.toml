[package]
name = "nwm_rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = { version = "0.2.180", default-features = false }
oorandom = "11.1.5"
function_name = "0.3.0"
# Modified to work with union types
const-default = { path = "../../const_default", version = "1.0.0", features = [
    "derive",
    "unstable",
] }

[build-dependencies]
bindgen = "0.72.1"

[features]
o3ds = []
mem3 = ["o3ds"]
